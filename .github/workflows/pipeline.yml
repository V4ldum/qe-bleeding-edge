name: CI/CD
on:
    workflow_dispatch:
    schedule:
        - cron: "15 3 * * *"

permissions:
    contents: read
    packages: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    PROJECT: qe

jobs:
    check-upstream:
        runs-on: ubuntu-latest
        outputs:
            project: ${{ env.PROJECT }}
            should-build: ${{ steps.check.outputs.should-build }}
            upstream-sha: ${{ steps.upstream.outputs.sha }}
        steps:
            - name: Get upstream latest commit
              id: upstream
              run: |
                  SHA=$(git ls-remote https://github.com/Voulk/QuestionablyEpic.git refs/heads/dev | awk '{print $1}')
                  echo "sha=$SHA" >> $GITHUB_OUTPUT
                  echo "Upstream SHA: $SHA"

            - name: Compare with current image
              id: check
              run: |
                  LAST_SHA=$(skopeo inspect \
                    --creds="V4ldum:${{ secrets.GITHUB_TOKEN }}" \
                    "docker://ghcr.io/v4ldum/qe:latest" 2>/dev/null \
                    | jq -r '.Labels["upstream.sha"] // "none"') || LAST_SHA="none"
                  echo "Last built SHA: $LAST_SHA"
                  if [ "$LAST_SHA" == "${{ steps.upstream.outputs.sha }}" ]; then
                    echo "should-build=false" >> $GITHUB_OUTPUT
                    echo "No changes, skipping build."
                  else
                    echo "should-build=true" >> $GITHUB_OUTPUT
                    echo "New commit detected, will build."
                  fi

    build:
        runs-on: ubuntu-latest
        needs: check-upstream
        if: needs.check-upstream.outputs.should-build == 'true'
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Log in to the Container registry
              uses: docker/login-action@v3
              with:
                  registry: https://ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx # For cross-platform support
              uses: docker/setup-buildx-action@v3

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  push: true
                  platforms: linux/amd64
                  build-args: |
                      UPSTREAM_SHA=${{ needs.check-upstream.outputs.upstream-sha }}
                  tags: |
                      ghcr.io/v4ldum/${{ env.PROJECT }}:latest
                      ghcr.io/v4ldum/${{ env.PROJECT }}:${{ github.sha }}

    deploy:
        needs: [check-upstream, build]
        if: needs.build.result == 'success'
        uses: v4ldum/shared-workflows/.github/workflows/deploy.yml@main
        with:
            project: ${{ needs.check-upstream.outputs.project }}
            drain: true
        secrets: inherit

    cleanup:
        needs: [check-upstream, build]
        if: needs.build.result == 'success'
        uses: v4ldum/shared-workflows/.github/workflows/cleanup.yml@main
        with:
            project: ${{ needs.check-upstream.outputs.project }}
        secrets: inherit
